services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kiln_cms_dev
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Optional: keyword search (hybrid with pgvector semantic already in core)
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meili_data:/meili_data]
    profiles: ["search"]

  # Optional: shared cache (Dragonfly) — only for multi-node, D2
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.21
    ports: ["6380:6379"]
    profiles: ["cache"]

  # Optional: S3-compatible storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    profiles: ["storage"]

  # Optional: self-hosted Llama (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    profiles: ["ml"]

  # Optional: LiveKit SFU for live rooms
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    profiles: ["livekit"]

volumes:
  pg_data:
  meili_data:
  minio_data:
  ollama_data:
